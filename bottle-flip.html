<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻瓶計分 · YWPS208</title>
<style>
  :root { --ink: #1c1c1c; --cream: #ffe9ba; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #ffe9ba url("assets/bottle-flip-bg.jpg") center top / cover no-repeat fixed;
  }
  .mast {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: max(13.6vw, 24vh);
    z-index: 50;
    pointer-events: none;
    background: url("assets/bottle-flip-bg.jpg") center top / cover no-repeat fixed;
  }
  .wrap {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: max(12.4vw, 21.6vh) 0 12px;
  }
  .panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255, 248, 234, 0.92);
    border: 4px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 14px 14px 16px;
  }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .top a, .top button, .pts button, .bonus, .undo {
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 12px;
    padding: 6px 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    color: inherit;
    text-decoration: none;
    font-family: inherit;
  }
  .top button.on { background: #ffd84a; }
  .classes { display: flex; gap: 8px; margin: 8px 0 12px; }
  .classes button {
    flex: 1;
    font-size: 28px;
    font-weight: 900;
    border: 4px solid var(--ink);
    border-radius: 16px;
    background: #fff;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 8px 0;
  }
  .classes button.on { transform: translate(1px, 1px); box-shadow: none; }
  .classes button[data-g="A"] { color: #e23d3d; }
  .classes button[data-g="B"] { color: #c89200; }
  .classes button[data-g="C"] { color: #2f9e44; }
  .classes button[data-g="D"] { color: #1d7ed8; }
  .classes button[data-g="E"] { color: #d23d8a; }
  .classes button[data-g="A"].on { background: #ffd0d6; }
  .classes button[data-g="B"].on { background: #ffe566; }
  .classes button[data-g="C"].on { background: #c8f5d0; }
  .classes button[data-g="D"].on { background: #d6ecff; }
  .classes button[data-g="E"].on { background: #ffd6ea; }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex: 1 1 auto;
    min-height: 180px;
    height: auto;
    margin-bottom: 52px;
    padding: 8px 8px 0;
    border-bottom: 4px solid var(--ink);
  }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar-wrap { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .bar {
    width: 72%;
    min-height: 12px;
    border: 3px solid var(--ink);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    transform-origin: bottom center;
    transition: height 1.05s cubic-bezier(.22, .72, .2, 1);
    position: relative;
    overflow: visible;
  }
  .rider {
    position: absolute;
    left: 50%;
    bottom: calc(100% - 2px);
    width: 148%;
    height: auto;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 3;
    user-select: none;
  }
  .shine {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 48%;
    background: linear-gradient(to top, rgba(255,255,255,.08), rgba(255,255,255,.9));
    opacity: 0;
    pointer-events: none;
  }
  .bar.hot .shine { animation: rise 1.5s ease-in-out infinite; }
  @keyframes rise {
    0% { transform: translateY(45%); opacity: .25; }
    65% { opacity: .9; }
    100% { transform: translateY(-140%); opacity: 0; }
  }
  .col[data-g="A"] .bar { background: #ff8fab; }
  .col[data-g="B"] .bar { background: #ffd84a; }
  .col[data-g="C"] .bar { background: #7ed957; }
  .col[data-g="D"] .bar { background: #7ec8ff; }
  .col[data-g="E"] .bar { background: #ff9ad5; }
  .col.live .bar {
    animation: flash 0.7s ease-in-out infinite;
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px #e0a106;
  }
  @keyframes flash {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.45); }
  }
  .col.shake .bar { animation: shake 0.45s linear; }
  .col.finale .bar { animation: finale 0.7s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes finale {
    0% { transform: scaleY(1); filter: brightness(1); }
    30% { transform: scaleY(1.08) scaleX(1.06); filter: brightness(1.8); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  .score-pop {
    position: absolute;
    left: 50%;
    top: -8px;
    transform: translate(-50%, 0);
    font-size: 22px;
    font-weight: 900;
    pointer-events: none;
    z-index: 4;
    text-shadow: 0 1px 0 #fff, 0 0 4px #fff;
  }
  .col.pop .score-pop { animation: pop 0.35s ease; }
  @keyframes pop {
    0% { transform: translate(-50%, 8px) scale(0.6); }
    60% { transform: translate(-50%, -16px) scale(1.2); }
    100% { transform: translate(-50%, 0) scale(1); }
  }
  .label { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 20px; margin-top: 6px; }
  .label svg { width: 22px; height: 22px; }
  .meta { font-size: 13px; font-weight: 700; min-height: 1.2em; }
  .phrase { text-align: center; font-weight: 800; margin: 10px 0 4px; }
  .bottles { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .bottle {
    width: 28px;
    font-size: 15px;
    text-align: center;
    font-weight: 900;
    opacity: 0.35;
    transform: rotate(70deg);
    transition: transform 0.35s ease, opacity 0.35s;
  }
  .bottle.up { opacity: 1; transform: rotate(0deg); }
  .pts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pts button { flex: 1; min-width: 52px; font-size: 20px; min-height: 48px; }
  .pts button:disabled, .bonus:disabled, .undo:disabled { opacity: 0.4; cursor: default; }
  .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .bonus { flex: 1; background: #ffd84a; font-size: 20px; min-height: 52px; }
  .save, .reset { flex: 1; background: #fff; font-size: 18px; min-height: 52px; }
  .reset { background: #ffe0e0; }
  .undo { min-width: 140px; font-size: 18px; min-height: 52px; }
  .hint { margin: 8px 0 0; font-size: 14px; font-weight: 700; }
  body:not(.ops) .top,
  body:not(.ops) .classes,
  body:not(.ops) .phrase,
  body:not(.ops) .bottles,
  body:not(.ops) .pts,
  body:not(.ops) .row2,
  body:not(.ops) .hint { display: none; }
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
</style>
</head>
<body>
  <div class="mast" aria-hidden="true"></div>
  <div class="wrap">
    <div class="panel">
      <div id="opsHead" style="display:none">
      <div class="top">
        <a href="校慶禮堂.html">返回計分牌</a>
        <button type="button" data-session="p46">高小</button>
        <button type="button" data-session="p13">初小</button>
      </div>
      <div class="classes" id="classes"></div>
      </div>
      <div class="chart" id="chart"></div>
      <div id="opsPanel" style="display:none">
      <p class="phrase">每組 11 枝瓶。成功幾枝就按幾分，排成 YW208 再按加 5 分。同一班可以一組接一組計。</p>
      <div class="bottles" id="bottles"></div>
      <div class="pts" id="pts"></div>
      <div class="row2">
        <button type="button" class="bonus" id="bonusBtn">加 5 分</button>
        <button type="button" class="save" id="saveBtn">寫入第三欄</button>
        <button type="button" class="reset" id="resetBtn">分數歸零</button>
        <button type="button" class="undo" id="undoBtn">復原上一步</button>
      </div>
      <p class="hint" id="hint">先按 A–E 選班，再按該組成功的枝數。加 5 分每班、每一組都可以再按。寫入第三欄才把總分送到計分牌。</p>
      </div>
    </div>
  </div>
  <canvas class="fx" id="fx"></canvas>
  <audio id="ding" src="assets/sounds/ding.wav" preload="auto"></audio>
  <audio id="bonusSnd" src="assets/sounds/bonus.wav" preload="auto"></audio>
  <audio id="windSnd" src="assets/sounds/wind.wav" preload="auto"></audio>
<script>
const KEY = "yw208-hall-kit-v1";
const META = "yw208-bottle-flip-v1";
const CLASSES = ["A", "B", "C", "D", "E"];
const BOTTLE_COUNT = 11;
const BOTTLES = ["Y", "W", "2", "0", "8", "Y", "W", "2", "0", "8", "Y"];
const SCORE_COL = 2;
const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("yw208-hall") : null;
const dingTimers = [];
let hall;
let meta;
let active = "A";
let applying = false;
let justPosted = false;
const popGen = {};

function emptySession() {
  const scores = {};
  const drawn = {};
  CLASSES.forEach((g) => { scores[g] = [0, 0, 0, 0]; drawn[g] = []; });
  return { names: ["", "", "", ""], scores, drawn, activeRound: 0 };
}
function blankHall() {
  return {
    mode: "rehearsal", session: "p46", screen: "board", sound: true, savedAt: "", undo: [],
    rehearsal: { p46: emptySession(), p13: emptySession() },
    live: { p46: emptySession(), p13: emptySession() }
  };
}
function repair(state) {
  ["rehearsal", "live"].forEach((mode) => {
    if (!state[mode]) state[mode] = { p46: emptySession(), p13: emptySession() };
    ["p46", "p13"].forEach((sid) => {
      if (!state[mode][sid] || !state[mode][sid].scores || !state[mode][sid].drawn || !Array.isArray(state[mode][sid].names)) {
        state[mode][sid] = emptySession();
      }
      const b = state[mode][sid];
      CLASSES.forEach((g) => {
        if (!Array.isArray(b.scores[g])) b.scores[g] = [0, 0, 0, 0];
        while (b.scores[g].length < 4) b.scores[g].push(0);
      });
    });
  });
  state.mode = "rehearsal";
  if (state.session !== "p13") state.session = state.session === "p46" ? "p46" : "p46";
  if (!Array.isArray(state.undo)) state.undo = [];
}
function loadAll() {
  try { hall = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { hall = null; }
  if (!hall || !hall.rehearsal || !hall.live) hall = blankHall();
  repair(hall);
  try { meta = JSON.parse(localStorage.getItem(META) || "null"); } catch (e) { meta = null; }
  if (!meta || !Array.isArray(meta.history)) meta = { totals: {}, shown: {}, history: [] };
  if (!meta.totals) meta.totals = {};
  if (!meta.shown) meta.shown = {};
}
function board() { return hall[hall.mode][hall.session]; }
function packKey(g) { return hall.mode + "|" + hall.session + "|" + g; }
function bottleTotal(g) { return meta.totals[packKey(g)] || 0; }
function shownOf(g) { return meta.shown[packKey(g)] || 0; }
function barMax() {
  const chart = document.getElementById("chart");
  const col = chart && chart.querySelector(".bar-wrap");
  if (!col || col.clientHeight < 80) return 248;
  const riderH = Math.round(col.clientWidth * 0.72 * 1.48 * (1777 / 3508));
  return Math.max(80, col.clientHeight - riderH - 10);
}
function barHeight(score) {
  const maxH = barMax();
  if (score <= 0) return Math.max(12, Math.round(maxH * 0.04));
  const early = Math.min(score, 30) * 2.2;
  const later = Math.max(0, score - 30) * 0.85;
  const scaled = (12 + early + later) * (maxH / 248);
  return Math.round(Math.min(maxH, Math.max(12, scaled)));
}
function saveMeta() { localStorage.setItem(META, JSON.stringify(meta)); }
function commit() {
  hall.savedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(hall));
  if (!applying && channel) channel.postMessage({ type: "state", state: hall, animate: true });
  saveMeta();
}

function b64ToAudio(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return audioCtx.decodeAudioData(bytes.buffer);
}
function loadSound(url, b64) {
  return fetch(url).then((r) => {
    if (!r.ok) throw new Error("sound");
    return r.arrayBuffer();
  }).then((buf) => audioCtx.decodeAudioData(buf)).catch(() => b64ToAudio(b64));
}

function playBuffer(buf, level) {
  if (!buf || audioCtx.state === "closed") return;
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  gain.gain.value = level;
  src.buffer = buf;
  src.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
  liveSources.push(src);
  src.onended = () => {
    const i = liveSources.indexOf(src);
    if (i >= 0) liveSources.splice(i, 1);
  };
}

function fireworks(origin) {
  const canvas = document.getElementById("fx");
  const rect = canvas.getBoundingClientRect();
  const box = origin.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const x = box.left + box.width / 2 - rect.left;
  const y = box.top + box.height * 0.2 - rect.top;
  const colors = ["#ff5a7a", "#ffd84a", "#7ed957", "#7ec8ff", "#fff7d6", "#ff9ad5"];
  const sparks = [];
  for (let b = 0; b < 4; b++) {
    const cx = x + (b - 1.5) * 42;
    const cy = y - b * 16;
    for (let i = 0; i < 26; i++) {
      const a = (Math.PI * 2 * i) / 26 + Math.random() * 0.25;
      const sp = 1.5 + Math.random() * 2.6;
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.4,
        life: 1,
        color: colors[(i + b) % colors.length],
        w: 2 + Math.random() * 2.2
      });
    }
  }
  let last = performance.now();
  const frame = (now) => {
    const dt = Math.min(2, (now - last) / 16.67);
    last = now;
    ctx.clearRect(0, 0, rect.width, rect.height);
    let alive = false;
    sparks.forEach((p) => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.055 * dt;
      p.life -= 0.016 * dt;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, rect.width, rect.height);
  };
  requestAnimationFrame(frame);
}

    col.className = "col";
    col.dataset.g = g;
    col.innerHTML =
      '<div class="bar-wrap"><div class="bar"><img class="rider" src="assets/YW boys 3.png" alt=""><span class="shine"></span><span class="score-pop"></span></div></div>' +
      '<div class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#7ec8ff" stroke="#1c1c1c" stroke-width="1.4" d="M9 2h6v3l2 3v12a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V8l2-3z"/><path fill="#fff" d="M10 3h4v2h-4z"/></svg><span>' + g + '</span></div>' +
      '<div class="meta"></div>';
    chart.appendChild(col);
  });
  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.n = String(n);
    b.textContent = String(n);
    b.addEventListener("click", () => addPoints(n));
    pts.appendChild(b);
  }
  BOTTLES.forEach((ch) => {
    const s = document.createElement("div");
    s.className = "bottle";
    s.textContent = ch;
    bottles.appendChild(s);
  });
  document.getElementById("bonusBtn").addEventListener("click", addBonus);
  document.getElementById("saveBtn").addEventListener("click", finalize);
  document.getElementById("resetBtn").addEventListener("click", resetScores);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.querySelectorAll("[data-session]").forEach((btn) => {
    btn.addEventListener("click", () => { hall.session = btn.dataset.session; commit(); render(); });
  });
  document.addEventListener("keydown", (ev) => {
    if (!document.body.classList.contains("ops")) return;
    if (ev.target.matches && ev.target.matches("input, textarea")) return;
    const map = { a: "A", b: "B", c: "C", d: "D", e: "E" };
    if (map[ev.key.toLowerCase()] && !ev.ctrlKey && !ev.metaKey) { active = map[ev.key.toLowerCase()]; render(); }
    if (ev.key >= "1" && ev.key <= "9") addPoints(Number(ev.key));
    if (ev.key === "0") addPoints(10);
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); }
  });
}
function render() {
  document.querySelectorAll("[data-session]").forEach((btn) => btn.classList.toggle("on", btn.dataset.session === hall.session));
  document.querySelectorAll("#classes button").forEach((btn) => btn.classList.toggle("on", btn.dataset.g === active));
  CLASSES.forEach((g) => {
    const col = document.querySelector('.col[data-g="' + g + '"]');
    const sum = bottleTotal(g);
    const bar = col.querySelector(".bar");
    bar.style.height = barHeight(sum) + "px";
    bar.classList.toggle("hot", sum >= 100);
    col.querySelector(".score-pop").textContent = String(sum);
    const posted = board().scores[g][SCORE_COL];
    col.querySelector(".meta").textContent = "本組 " + shownOf(g) + "/" + BOTTLE_COUNT + (posted === sum && sum > 0 ? " · 已入第三欄" : "");
    col.classList.toggle("live", g === active);
  });
  document.querySelectorAll(".bottle").forEach((el, i) => el.classList.toggle("up", i < shownOf(active)));
  document.querySelectorAll("#pts button").forEach((btn) => { btn.disabled = false; });
  document.getElementById("bonusBtn").disabled = false;
  document.getElementById("undoBtn").disabled = !meta.history.length;
  const ses = hall.session === "p13" ? "初小" : "高小";
  const postedNote = justPosted ? "各班總分已寫入計分牌第三欄（該欄沒有名稱，這裡不會改它）。" : "總分先留在這頁。按「寫入第三欄」才送到計分牌的第三欄，不會加進第一欄。";
  document.getElementById("hint").textContent =
    "正在計 " + ses + " · " + active + " 班。1–10 和加 5 分可以一直按。" + postedNote + "復原記住最近 " + meta.history.length + " 步。";
}

function remember(entry) {
  meta.history.push(entry);
  if (meta.history.length > 20) meta.history.shift();
}
function addPoints(n) {
  if (n < 1 || n > 10) return;
  justPosted = false;
  stopDings();
  const g = active;
  const mode = hall.mode;
  const session = hall.session;
  remember({ mode, session, g, points: n, kind: "points", prevShown: shownOf(g) });
  meta.totals[packKey(g)] = bottleTotal(g) + n;
  meta.shown[packKey(g)] = Math.min(BOTTLE_COUNT, n);
  saveMeta();
  runSteps(g, n);
}
function addBonus() {
  justPosted = false;
  const g = active;
  remember({ mode: hall.mode, session: hall.session, g, points: 5, kind: "bonus" });
  meta.totals[packKey(g)] = bottleTotal(g) + 5;
  saveMeta();
  playBonus();
  playWind();
  fireworks(document.querySelector('.col[data-g="' + g + '"] .bar'));
  const col = document.querySelector('.col[data-g="' + g + '"]');
  col.classList.remove("finale");
  void col.offsetWidth;
  col.classList.add("finale");
  setTimeout(() => col.classList.remove("finale"), 750);
  render();
}
function resetScores() {
  const ses = hall.session === "p13" ? "初小" : "高小";
  if (!window.confirm("確定把「" + ses + "」的翻瓶分數歸零？長條圖和計分牌第三欄會一起變回 0。其他欄不會改。")) return;
  stopDings();
  justPosted = false;
  const mode = hall.mode;
  const session = hall.session;
  const pack = hall[mode][session];
  const totals = {};
  const shown = {};
  const before = {};
  CLASSES.forEach((g) => {
    const key = mode + "|" + session + "|" + g;
    totals[g] = meta.totals[key] || 0;
    shown[g] = meta.shown[key] || 0;
    before[g] = pack.scores[g][SCORE_COL];
    meta.totals[key] = 0;
    meta.shown[key] = 0;
    pack.scores[g][SCORE_COL] = 0;
  });
  remember({ mode, session, kind: "reset", totals, shown, before });
  commit();
  render();
}
function finalize() {
  const mode = hall.mode;
  const session = hall.session;
  const pack = hall[mode][session];
  const before = {};
  CLASSES.forEach((g) => { before[g] = pack.scores[g][SCORE_COL]; });
  remember({ mode, session, kind: "finalize", before });
  CLASSES.forEach((g) => { pack.scores[g][SCORE_COL] = bottleTotal(g); });
  justPosted = true;
  commit();
  render();
}
function runSteps(g, n) {
  const finalSum = bottleTotal(g);
  const gen = (popGen[g] || 0) + 1;
  popGen[g] = gen;
  render();
  const col = document.querySelector('.col[data-g="' + g + '"]');
  const start = finalSum - n;
  col.querySelector(".score-pop").textContent = String(start);
  let step = 0;
  const tick = () => {
    if (popGen[g] !== gen) return;
    step += 1;
    playDing();
    col.classList.remove("pop");
    void col.offsetWidth;
    col.classList.add("pop");
    col.querySelector(".score-pop").textContent = String(start + step);
    if (step < n) dingTimers.push(setTimeout(tick, 280));
  };
  tick();
}
function undo() {
  if (!meta.history.length) return;
  stopDings();
  justPosted = false;
  const last = meta.history.pop();
  if (last.kind === "finalize") {
    const pack = hall[last.mode][last.session];
    CLASSES.forEach((g) => { pack.scores[g][SCORE_COL] = last.before[g]; });
    commit();
  } else if (last.kind === "reset") {
    const pack = hall[last.mode][last.session];
    CLASSES.forEach((g) => {
      const key = last.mode + "|" + last.session + "|" + g;
      meta.totals[key] = last.totals[g] || 0;
      meta.shown[key] = last.shown[g] || 0;
      pack.scores[g][SCORE_COL] = last.before[g];
    });
    commit();
  } else {
    const key = last.mode + "|" + last.session + "|" + last.g;
    meta.totals[key] = Math.max(0, (meta.totals[key] || 0) - last.points);
    if (last.kind === "points") meta.shown[key] = last.prevShown || 0;
    saveMeta();
  }
  const col = document.querySelector('.col[data-g="' + (last.g || active) + '"]');
  if (col) col.classList.remove("shake", "finale", "pop");
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  render();
}

function setOps(on) {
  document.body.classList.toggle("ops", on);
  ["opsHead", "opsPanel"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.style.display = on ? "block" : "none";
  });
}
window.addEventListener("keydown", (ev) => {
  const keyH = ev.code === "KeyH" || (ev.key && ev.key.toLowerCase() === "h");
  if (!((ev.ctrlKey || ev.metaKey) && ev.shiftKey && keyH)) return;
  ev.preventDefault();
  ev.stopPropagation();
  setOps(!document.body.classList.contains("ops"));
}, true);
loadAll();
setOps(false);
build();
render();
requestAnimationFrame(render);
window.addEventListener("resize", () => render());
if (channel) {
  channel.onmessage = (ev) => {
    const msg = ev.data || {};
    if (msg.type !== "state" || !msg.state) return;
    applying = true;
    hall = msg.state;
    repair(hall);
    applying = false;
    render();
  };
}
window.addEventListener("storage", (ev) => {
  if (ev.key === KEY || ev.key === META) { loadAll(); render(); }
});
</script>
</body>
