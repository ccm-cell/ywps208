<script>
const KEY = "yw208-hall-kit-v1";
const CLASSES = ["A", "B", "C", "D", "E"];
const ROUNDS = 4;
const MAXN = 33;
const SESSIONS = {
  p46: {
    badge: "P4-6計分牌",
    short: "高小 P4–P6",
    groups: { A: "4A+5A+6A", B: "4B+5B+6B", C: "4C+5C+6C", D: "4D+5D+6D", E: "4E+5E+6E" }
  },
  p13: {
    badge: "P1-3計分牌",
    short: "初小 P1–P3",
    groups: { A: "1A+2A+3A", B: "1B+2B+3B", C: "1C+2C+3C", D: "1D+2D+3D", E: "1E+2E+3E" }
  }
};
const ROW_TOP = [368, 460, 552, 644];
const SCORE_X = [295, 540, 789, 1031, 1284];
const SCORE_Y = [402, 494, 586, 675, 765];

function emptySession() {
  const scores = {};
  const drawn = {};
  CLASSES.forEach((g) => {
    scores[g] = [0, 0, 0, 0];
    drawn[g] = [];
  });
  return { names: ["", "", "", ""], scores, drawn, activeRound: 0 };
}
function emptyPack() {
  return { p46: emptySession(), p13: emptySession() };
}

let state = {
  mode: "rehearsal",
  session: "p46",
  screen: "board",
  sound: true,
  savedAt: "",
  undo: [],
  rehearsal: emptyPack(),
  live: emptyPack()
};
let applying = false;
let animateNext = false;
let spinning = false;
let heard = false;
let fileHandle = null;
let saveTimer = null;
let lastSaveNote = "分數會自動存檔";
const shown = new WeakMap();
const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("yw208-hall") : null;

function board() { return state[state.mode][state.session]; }
function sessionInfo() { return SESSIONS[state.session]; }

function repairState() {
  ["rehearsal", "live"].forEach((mode) => {
    if (!state[mode]) state[mode] = emptyPack();
    ["p46", "p13"].forEach((sid) => {
      const b = state[mode][sid];
      if (!b || !b.scores || !b.drawn || !Array.isArray(b.names)) state[mode][sid] = emptySession();
    });
  });
  if (!Array.isArray(state.undo)) state.undo = [];
  if (state.mode !== "live" && state.mode !== "rehearsal") state.mode = "rehearsal";
  if (state.session !== "p13" && state.session !== "p46") state.session = "p46";
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || !raw.rehearsal || !raw.live) return;
    state = raw;
  } catch (err) { /* keep the blank rehearsal board */ }
  repairState();
}
function scoreSnapshot() {
  const b = board();
  return {
    mode: state.mode,
    session: state.session,
    scores: JSON.parse(JSON.stringify(b.scores)),
    names: b.names.slice(),
    activeRound: b.activeRound
  };
}
function pushUndo() {
  if (applying) return;
  state.undo.push(scoreSnapshot());
  if (state.undo.length > 30) state.undo.shift();
}
function undoLast() {
  if (!state.undo.length || spinning) return;
  const prev = state.undo.pop();
  state.mode = prev.mode;
  state.session = prev.session;
  const b = board();
  b.scores = prev.scores;
  b.names = prev.names;
  b.activeRound = prev.activeRound;
  clearShown();
  animateNext = false;
  commit(false);
  render();
}
function exportData() {
  return {
    savedAt: state.savedAt || new Date().toISOString(),
    mode: state.mode,
    session: state.session,
    screen: state.screen,
    sound: state.sound,
    undo: state.undo,
    rehearsal: state.rehearsal,
    live: state.live
  };
}
function applyImported(data) {
  if (!data || !data.rehearsal || !data.live) return false;
  state.mode = data.mode === "live" ? "live" : "rehearsal";
  state.session = data.session === "p13" ? "p13" : "p46";
  state.screen = data.screen === "draw" ? "draw" : (state.screen || "board");
  state.sound = data.sound !== false;
  state.savedAt = data.savedAt || "";
  state.undo = Array.isArray(data.undo) ? data.undo : [];
  state.rehearsal = data.rehearsal;
  state.live = data.live;
  repairState();
  return true;
}
function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("yw208-files", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function rememberHandle(handle) {
  return idb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "scores");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function recallHandle() {
  return idb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get("scores");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  })).catch(() => null);
}
async function writeOpfs() {
  if (!navigator.storage || !navigator.storage.getDirectory) return false;
  const root = await navigator.storage.getDirectory();
  const fh = await root.getFileHandle("yw208-scores.json", { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(exportData()));
  await w.close();
  return true;
}
async function readOpfs() {
  try {
    const root = await navigator.storage.getDirectory();
    const fh = await root.getFileHandle("yw208-scores.json");
    const file = await fh.getFile();
    return JSON.parse(await file.text());
  } catch (err) { return null; }
}
async function writeChosenFile() {
  if (!fileHandle) return false;
  const perm = await fileHandle.queryPermission({ mode: "readwrite" });
  if (perm !== "granted") return false;
  const w = await fileHandle.createWritable();
  await w.write(JSON.stringify(exportData(), null, 2));
  await w.close();
  return true;
}
function markSaved(where) {

  lastSaveNote = "已自動存檔 " + clock + (where ? " · " + where : "");

}
async function flushSave() {
  let where = "瀏覽器";
  try { if (await writeOpfs()) where = "瀏覽器檔案"; } catch (err) { /* local copy still saved */ }
  try { if (await writeChosenFile()) where = "分數檔"; } catch (err) { /* keep the browser copy */ }
  markSaved(where);
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}
function commit(animate) {
  state.savedAt = new Date().toISOString();

let audioCtx = null;
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function blip(freq, dur, type, vol, slide) {
  if (!state.sound) return;
  const c = audio();
  if (!c) return;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, c.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + dur);
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g);
  g.connect(c.destination);
  o.start();
  o.stop(c.currentTime + dur + 0.02);
}
function soundScore(delta) {
  if (delta > 0) {
    blip(784, 0.07, "square", 0.055);
    setTimeout(() => blip(1175, 0.11, "square", 0.045), 55);
  } else if (delta < 0) {
    blip(392, 0.13, "triangle", 0.05, 196);
  }
}
let shakeTimer = null;
function noiseBurst(seconds, volume) {
  if (!state.sound) return;
  const c = audio();
  if (!c) return;
  const count = Math.max(1, Math.floor(c.sampleRate * seconds));
  const buf = c.createBuffer(1, count, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < count; i++) data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / count);
  const src = c.createBufferSource();
  const filter = c.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 780;
  filter.Q.value = 0.6;
  const g = c.createGain();
  g.gain.value = volume;
  src.buffer = buf;
  src.connect(filter);
  filter.connect(g);
  g.connect(c.destination);
  src.start();
}
function startShake() {
  stopShake();
  noiseBurst(0.12, 0.18);
  shakeTimer = setInterval(() => noiseBurst(0.07, 0.12), 95);
}
function stopShake() {
  if (shakeTimer) clearInterval(shakeTimer);
  shakeTimer = null;
}
function soundRoll() { startShake(); }
function soundLand(i) {
  const notes = [523, 659, 784, 988, 1175];
  blip(notes[i], 0.22, "sine", 0.09);
  blip(notes[i] * 2, 0.16, "triangle", 0.035);
  blip(notes[i] * 3, 0.12, "sine", 0.018);
}

function fitName(input) {
  const len = (input.value || "").trim().length;
  input.style.fontSize = len <= 4 ? "30px" : len <= 6 ? "24px" : "18px";
}
function clearShown() {
  document.querySelectorAll(".cell").forEach((el) => shown.delete(el));
}
function paintNum(el, n) {
  const host = el.querySelector(".total-num") || el;
  const prev = shown.has(el) ? shown.get(el) : n;
  shown.set(el, n);
  if (el.querySelector("input")) return;
  if (animateNext && prev !== n) {
    if (!heard) {
      soundScore(n - prev);
      heard = true;
    }
    host.classList.remove("bump");
    void host.offsetWidth;
    host.classList.add("bump");
    const from = prev;
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / 380);
      const eased = 1 - Math.pow(1 - p, 3);
      host.textContent = String(Math.round(from + (n - from) * eased));
      if (p < 1 && shown.get(el) === n) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  } else {
    host.textContent = String(n);
  }
}

function renderChips() {
  const b = board();
  document.querySelectorAll(".chip").forEach((chip) => {
    const r = Number(chip.dataset.r);

function rankMap(sums) {
  const unique = [...new Set(CLASSES.map((g) => sums[g]))].sort((a, b) => b - a);
  const placeByScore = {};
  if (unique.length > 1) unique.slice(0, 3).forEach((score, i) => { placeByScore[score] = i + 1; });
  const out = {};
  CLASSES.forEach((g) => { if (placeByScore[sums[g]]) out[g] = placeByScore[sums[g]]; });
  return out;
}
function paintMedal(img, place) {
  const labels = { 1: "第1名", 2: "第2名", 3: "第3名" };
  if (!place) {
    img.hidden = true;
    img.alt = "";
    img.dataset.rank = "";
    return;
  }
  const next = String(place);
  if (img.dataset.rank !== next) {
    img.classList.remove("pop");
    void img.offsetWidth;
    img.classList.add("pop");
  }
  img.dataset.rank = next;
  img.src = "assets/medal-" + place + ".png";
  img.alt = labels[place];
  img.hidden = false;
}
function renderScores() {
  const b = board();
  const sums = {};
  CLASSES.forEach((g) => {
    let sum = 0;
    b.scores[g].forEach((n, r) => {
      sum += n;
      const el = document.querySelector('.cell[data-g="' + g + '"][data-r="' + r + '"]');
      el.classList.toggle("hot", r === b.activeRound);
      paintNum(el, n);

function renderNames() {

function pool(g) {
  const used = new Set(board().drawn[g]);
  const out = [];
  for (let n = 1; n <= MAXN; n++) if (!used.has(n)) out.push(n);
  return out;
}
function renderLottery() {

function render() {

function setScore(g, r, value) {
  const b = board();
  const next = Math.round(value);
  if (!Number.isFinite(next) || next === b.scores[g][r]) {
    animateNext = false;
    render();
    return;
  }
  pushUndo();
  b.scores[g][r] = next;
  b.activeRound = r;
  animateNext = true;
  commit(true);
  render();
}
function addScore(g, delta) {
  const b = board();
  const r = b.activeRound;
  setScore(g, r, b.scores[g][r] + delta);
}
function editCell(btn) {
  if (btn.querySelector("input")) return;
  const g = btn.dataset.g;
  const r = Number(btn.dataset.r);
  board().activeRound = r;
  animateNext = false;
  render();
  const input = document.createElement("input");
  input.className = "cell-editor";
  input.inputMode = "numeric";
  input.value = String(board().scores[g][r]);
  btn.textContent = "";
  btn.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (ok) => {
    if (done) return;
    done = true;
    const raw = input.value.trim();
    input.remove();
    if (ok && raw !== "" && Number.isFinite(Number(raw))) setScore(g, r, Number(raw));
    else render();
  };
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") finish(true);
    if (ev.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

function burst(numEl) {

function playColumn(g, index, finalNumber) {
  const num = document.querySelector('.reel[data-g="' + g + '"] .num');
  if (finalNumber == null) {
    num.classList.remove("spin");
    num.textContent = "滿";

  num.classList.add("spin");
  const timer = setInterval(() => {
    num.textContent = String(1 + Math.floor(Math.random() * MAXN));
  }, 45);
  setTimeout(() => {
    clearInterval(timer);
    num.classList.remove("spin");
    num.textContent = String(finalNumber);
    num.classList.remove("land");
    void num.offsetWidth;
    num.classList.add("land");
    soundLand(index);
    burst(num);
  }, 1100 + index * 340);
}
function playDraw(results, done) {
  spinning = true;
  soundRoll();
  renderLottery();
  CLASSES.forEach((g, i) => playColumn(g, i, results[g]));
  setTimeout(() => {
    stopShake();
    spinning = false;
    if (done) done();
    else renderLottery();
  }, 1100 + 4 * 340 + 120);
}
function drawAll() {
  if (spinning) return;
  const results = {};
  let any = false;
  CLASSES.forEach((g) => {
    const left = pool(g);
    if (!left.length) results[g] = null;
    else {
      results[g] = left[Math.floor(Math.random() * left.length)];
      any = true;
    }
  });
  if (!any) return;
  if (channel) channel.postMessage({ type: "draw", results });
  playDraw(results, () => {
    CLASSES.forEach((g) => {
      if (results[g] != null) board().drawn[g].push(results[g]);
    });
    commit(false);
    render();
  });
}
function drawOne(g) {
  if (spinning) return;
  const left = pool(g);
  if (!left.length) return;
  const n = left[Math.floor(Math.random() * left.length)];
  const index = CLASSES.indexOf(g);
  if (channel) channel.postMessage({ type: "drawOne", g, n, index });
  spinning = true;
  startShake();
  renderLottery();
  playColumn(g, index, n);
  setTimeout(() => {
    stopShake();
    spinning = false;
    board().drawn[g].push(n);
    commit(false);
    render();
  }, 1100 + index * 340 + 80);
}

function fit() {
  const wrap = document.getElementById("fit");
  const stage = document.getElementById("stage");
  const s = Math.min(wrap.clientWidth / 1440, wrap.clientHeight / 810);
  const gap = Math.max(0, (wrap.clientWidth - 1440 * s) / 2);
  stage.style.transform = "scale(" + s + ")";
  stage.style.left = gap + "px";
  stage.style.top = Math.max(0, (wrap.clientHeight - 810 * s) / 2) + "px";
  const room = Math.max(0, gap - 24);
  const boyRatio = 563 / 404;
  let boyW = room;
  let boyH = Math.round(boyW * boyRatio);
  const maxH = Math.floor(wrap.clientHeight * 0.78);
  if (boyH > maxH) {
    boyH = maxH;
    boyW = Math.round(boyH / boyRatio);
  }
  document.querySelectorAll(".side-boy").forEach((img) => {
    img.style.width = boyW + "px";
    img.style.height = boyH + "px";
  });
}

}
document.getElementById("fullBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const on = document.fullscreenElement || document.webkitFullscreenElement;
  if (!on) {
    const ask = root.requestFullscreen || root.webkitRequestFullscreen;
    if (ask) ask.call(root);
  } else {
    const leave = document.exitFullscreen || document.webkitExitFullscreen;
    if (leave) leave.call(document);
  }
});
document.addEventListener("fullscreenchange", syncFullBtn);
document.addEventListener("webkitfullscreenchange", syncFullBtn);
document.getElementById("undoBtn").addEventListener("click", undoLast);
document.getElementById("pickPractice").addEventListener("click", () => chooseMode("rehearsal"));
document.getElementById("pickLive").addEventListener("click", () => chooseMode("live"));
document.getElementById("saveFileBtn").addEventListener("click", async () => {
  const payload = JSON.stringify(exportData(), null, 2);
  if (!window.showSaveFilePicker) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
    a.download = "校慶分數.json";
    a.click();
    markSaved("已下載");
    return;
  }
  try {
    fileHandle = await showSaveFilePicker({
      suggestedName: "校慶分數.json",
      types: [{ description: "分數檔", accept: { "application/json": [".json"] } }]
    });
    await rememberHandle(fileHandle);
    await writeChosenFile();
    markSaved("分數檔");
  } catch (err) {
    if (!err || err.name !== "AbortError") markSaved("存檔未完成");
  }
});
function chooseMode(mode) {
  state.mode = mode;
  clearShown();
  animateNext = false;
  document.getElementById("modeGate").hidden = true;
  commit(false);
  render();
}
document.getElementById("popBtn").addEventListener("click", () => {
  const url = new URL(location.href);
  url.searchParams.set("view", "display");
  window.open(url.toString(), "yw208display");
});
document.getElementById("showChrome").addEventListener("click", () => {
  document.body.classList.remove("display");
  fit();
});
document.getElementById("resetScores").addEventListener("click", resetScores);
document.getElementById("resetDraws").addEventListener("click", resetDraws);
document.getElementById("drawAll").addEventListener("click", drawAll);
document.addEventListener("pointerdown", () => { if (state.sound) audio(); });
document.addEventListener("keydown", (ev) => {
  const typing = ev.target && ev.target.matches && ev.target.matches("input, textarea");
  if (!typing && (ev.key === "f" || ev.key === "F") && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    document.getElementById("fullBtn").click();
  }
  if (!typing && (ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === "z") {
    ev.preventDefault();
    undoLast();
  }
});
window.addEventListener("resize", fit);

if (channel) {
  channel.onmessage = (ev) => {
    const msg = ev.data || {};
    if (msg.type === "state") {
      applying = true;
      const prevSession = state.session;
      const prevMode = state.mode;
      state = msg.state;
      if (prevSession !== state.session || prevMode !== state.mode) clearShown();
      animateNext = !!msg.animate;
      render();
      applying = false;
    } else if (msg.type === "draw") {
      playDraw(msg.results, null);
    } else if (msg.type === "drawOne") {
      spinning = true;
      startShake();
      renderLottery();
      playColumn(msg.g, msg.index, msg.n);
      setTimeout(() => { stopShake(); spinning = false; renderLottery(); }, 1100 + msg.index * 340 + 80);
    }
  };
}

load();
buildBoard();
const isDisplay = new URLSearchParams(location.search).get("view") === "display";
if (isDisplay) document.body.classList.add("display");
else document.getElementById("modeGate").hidden = false;
render();
setInterval(() => { if (!applying) flushSave(); }, 15000);

(async () => {
  fileHandle = await recallHandle();
  let localAt = state.savedAt || "";
  if (!localStorage.getItem(KEY)) {
    const backup = await readOpfs();
    if (backup && applyImported(backup)) {
      localStorage.setItem(KEY, JSON.stringify(state));
      localAt = state.savedAt || "";
      render();
    }
  }
  if (!fileHandle) return;
  try {
    const perm = await fileHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") return;
    const data = JSON.parse(await (await fileHandle.getFile()).text());
    if (data && data.savedAt && data.savedAt > localAt && applyImported(data)) {
      localStorage.setItem(KEY, JSON.stringify(state));
      render();
      markSaved("分數檔");
    }
  } catch (err) { /* keep the scores already on this computer */ }
})();
</script>
</body>
</html>
